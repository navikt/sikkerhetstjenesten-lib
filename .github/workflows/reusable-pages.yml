name: GitHub Pages (reusable)

# Gjenbrukbar workflow som publiserer rapporter og dokumentasjon til GitHub Pages.
# Forventer artifacts fra reusable-gradle-build.yml i samme workflow-kjøring.

on:
  workflow_call:
    inputs:
      jekyll:
        description: "Bygg repoets eksisterende Jekyll-nettsted som rot (ellers genereres en indeksside)"
        required: false
        type: boolean
        default: false
      detekt:
        description: "Publiser detekt-rapport (artifact 'detekt.html') under detekt/"
        required: false
        type: boolean
        default: false
      test-reports:
        description: "Publiser JaCoCo- og testrapport (artifact 'test-reports') under jacoco/ og tests/"
        required: false
        type: boolean
        default: false
      mkdocs-config:
        description: "Sti til mkdocs.yml (tom = ingen MkDocs)"
        required: false
        type: string
        default: ""
      mkdocs-path:
        description: "Undermappe MkDocs-nettstedet publiseres under"
        required: false
        type: string
        default: "adr"
      mkdocs-title:
        description: "Lenketekst for MkDocs-nettstedet på generert indeksside"
        required: false
        type: string
        default: "Dokumentasjon"
      title:
        description: "Tittel på generert indeksside"
        required: false
        type: string
        default: "Rapporter"
      url-path:
        description: "Sti som legges til page_url i environment-URLen, f.eks. 'detekt/'"
        required: false
        type: string
        default: ""
    outputs:
      page_url:
        description: "URL til publisert nettsted"
        value: ${{ jobs.pages.outputs.page_url }}

# Deny-by-default på workflow-nivå; jobs åpner kun det de trenger.
permissions:
  contents: read

jobs:
  pages:
    name: Publiser GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write     # actions/deploy-pages
      id-token: write  # actions/deploy-pages (OIDC)
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}${{ inputs.url-path }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Sjekker ut kode
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Konfigurer GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Bygg eksisterende Jekyll-nettsted
        if: ${{ inputs.jekyll }}
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./
          destination: ./_site

      - name: Gi runner eierskap til nettstedet
        if: ${{ inputs.jekyll }}
        run: sudo chown -R "$(id -u):$(id -g)" _site

      - name: Opprett nettstedsmappe
        run: mkdir -p _site

      - name: Last ned detekt-rapport
        if: ${{ inputs.detekt }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: detekt.html
          path: _site/detekt

      - name: Gjør detekt-rapporten til startside
        if: ${{ inputs.detekt }}
        run: mv _site/detekt/detekt.html _site/detekt/index.html

      - name: Last ned JaCoCo- og testrapport
        if: ${{ inputs.test-reports }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-reports
          path: reports

      - name: Kopier JaCoCo- og testrapport
        if: ${{ inputs.test-reports }}
        run: |
          mkdir -p _site/jacoco _site/tests
          cp -r reports/jacoco/test/html/. _site/jacoco/
          cp -r reports/tests/test/. _site/tests/

      - name: Bygg MkDocs-nettsted
        if: ${{ inputs.mkdocs-config != '' }}
        env:
          MKDOCS_CONFIG: ${{ inputs.mkdocs-config }}
          MKDOCS_PATH: ${{ inputs.mkdocs-path }}
        run: |
          pip install mkdocs-material
          mkdocs build -f "$MKDOCS_CONFIG" -d "$GITHUB_WORKSPACE/_site/$MKDOCS_PATH"

      - name: Generer indeksside
        if: ${{ !inputs.jekyll }}
        env:
          TITLE: ${{ inputs.title }}
          DETEKT: ${{ inputs.detekt }}
          TEST_REPORTS: ${{ inputs.test-reports }}
          MKDOCS: ${{ inputs.mkdocs-config != '' }}
          MKDOCS_PATH: ${{ inputs.mkdocs-path }}
          MKDOCS_TITLE: ${{ inputs.mkdocs-title }}
        run: |
          {
            echo "<!DOCTYPE html>"
            echo "<html>"
            echo "<body>"
            echo "  <h1>${TITLE}</h1>"
            echo "  <ul>"
            if [ "$TEST_REPORTS" = "true" ]; then
              echo '    <li><a href="jacoco/index.html">JaCoCo Coverage</a></li>'
              echo '    <li><a href="tests/index.html">Test Report</a></li>'
            fi
            if [ "$DETEKT" = "true" ]; then
              echo '    <li><a href="detekt/">Detekt</a></li>'
            fi
            if [ "$MKDOCS" = "true" ]; then
              echo "    <li><a href=\"${MKDOCS_PATH}/\">${MKDOCS_TITLE}</a></li>"
            fi
            echo "  </ul>"
            echo "</body>"
            echo "</html>"
          } > _site/index.html

      - name: Last opp nettsted
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Publiser nettsted
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
