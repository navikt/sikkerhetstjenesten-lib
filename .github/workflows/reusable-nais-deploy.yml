name: Nais deploy (reusable)

# Gjenbrukbar workflow som deployer et image til ett eller flere Nais-clustere.

on:
  workflow_call:
    inputs:
      team:
        description: "Nais-team (brukes i environment-navnet <cluster>:<team>)"
        required: true
        type: string
      clusters:
        description: 'JSON-liste med clustere, f.eks. ["dev-gcp","prod-gcp"]'
        required: true
        type: string
      resource:
        description: "Kommaseparert liste med Nais-ressurser"
        required: false
        type: string
        default: ".nais/naiserator.yaml"
      image:
        description: "Fullt image-ref som skal deployes"
        required: true
        type: string

# Deny-by-default på workflow-nivå; jobs åpner kun det de trenger.
permissions:
  contents: read

jobs:
  deploy:
    name: Deploy til ${{ matrix.cluster }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write  # nais/deploy/actions/deploy (OIDC mot Nais)
    strategy:
      matrix:
        cluster: ${{ fromJSON(inputs.clusters) }}
    environment: "${{ matrix.cluster }}:${{ inputs.team }}"
    env:
      PRINT_PAYLOAD: true
      TIMEOUT: 30m
      RESOURCE: ${{ inputs.resource }}
      CLUSTER: ${{ matrix.cluster }}
      VARS: .nais/${{ matrix.cluster }}.json
      IMAGE: ${{ inputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nais/deploy/actions/deploy@427e29c94d911626a023a76f402f6dcae1f840b7 # v3
